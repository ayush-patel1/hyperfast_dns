id: customer_pipeline
tenant_id: acme
name: Customer Master Sync
description: >
  Syncs the upstream CRM customers table into the analytics warehouse.
  Feeds churn models and the revenue dashboard.
owner: data-platform@acme.example
version: 1
source:
  kind: simulated
  entity: customers
contract: contracts/customer_pipeline.yaml
target_table: customers
transformations:
  customer_id: customer_id
  name: trim(name)
  age: age
  email: lower(trim(email))
  created_at: created_at
