pipeline: customer_pipeline
version: 1

schema:
  customer_id:
    type: integer
    nullable: false
    primary_key: true
  name:
    type: string
    nullable: false
  age:
    type: integer
    nullable: true
  email:
    type: string
    nullable: false
  created_at:
    type: timestamp
    nullable: false

quality:
  customer_id:
    unique: true
  email:
    format: email
  age:
    min: 0
    max: 120
    max_null_ratio: 0.1

drift:
  columns: [age]
  psi_threshold: 0.25
  ks_threshold: 0.3
  mean_shift_sigma: 3.0
  min_baseline: 200
  action: block
